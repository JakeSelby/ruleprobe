# The gate. Each job name is a required check on `main`, so renaming one is a ruleset change.
# In the order a failure is cheapest to read: the package compiles and its tests pass on the
# newest Python, the same suite passes on the 3.9 floor the package claims, every detector is
# still over the corpus floor, and the wheel builds, runs from an install and imports as a zip.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit's first parent is the base the PR was built on
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: compileall
        run: python -m compileall -q ruleprobe tests scripts
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: Audit BMad issue mapping
        run: python scripts/bmad_issue_sync.py audit
      - name: Version and changelog agree
        run: python scripts/release_preflight.py
      - name: A version bump is a folded release
        # On a pull request, a changed __version__ checks as a release of it, so a release PR that
        # leaves entries under ## Unreleased fails here instead of in release.yml after the tag.
        if: github.event_name == 'pull_request'
        run: |
          git show HEAD^1:ruleprobe/__init__.py > "$RUNNER_TEMP/base_init.py"
          python scripts/release_preflight.py --base-init "$RUNNER_TEMP/base_init.py"

  floor:
    # 3.9 is the floor `requires-python` claims; a newer syntax lands here before it lands on a user.
    name: floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - run: python -m unittest discover -s tests

  corpus:
    # The detector-validity gate: a detector under the floor fails the build, which is what
    # stops a hit rate from quietly becoming a rate of the detector. It is a gate on this
    # repository only; nothing in `ruleprobe report` reads the floor.
    name: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python -m ruleprobe corpus --no-config --floor 0.9

  package:
    # What a user installs, installed: the wheel carries its package data and the entry point runs.
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - name: The built metadata carries the SPDX licence expression
        run: |
          unzip -p dist/*.whl '*.dist-info/METADATA' > "$RUNNER_TEMP/METADATA"
          grep -qx 'License-Expression: MIT' "$RUNNER_TEMP/METADATA"
          grep -qx 'License-File: LICENSE' "$RUNNER_TEMP/METADATA"
          tar -xzOf dist/*.tar.gz --wildcards '*/PKG-INFO' > "$RUNNER_TEMP/PKG-INFO"
          grep -qx 'License-Expression: MIT' "$RUNNER_TEMP/PKG-INFO"
      - name: Install the wheel outside the checkout and run it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/ruleprobe" detectors
          "$RUNNER_TEMP/venv/bin/ruleprobe" corpus --no-config --floor 0.9
      - name: The declared API holds from the built wheel imported as a zip
        run: |
          RULEPROBE_WHEEL="$(ls dist/*.whl)" python -m unittest discover -s tests -p test_contract.py -v
