[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleprobe"
description = "Find out which of your agent rules actually fire: deterministic detectors over your coding agent's own transcripts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agents", "transcripts", "claude-code", "codex", "measurement", "rules"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
ruleprobe = "ruleprobe.cli:main"

[project.urls]
Homepage = "https://github.com/JakeSelby/ruleprobe"
Issues = "https://github.com/JakeSelby/ruleprobe/issues"

[tool.setuptools.dynamic]
version = { attr = "ruleprobe.__version__" }

[tool.setuptools.packages.find]
include = ["ruleprobe*"]
