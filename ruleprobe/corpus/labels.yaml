# The labels for the shipped corpus, in the same YAML subset a detector file is written in.
#
# One entry per labelled event. `at` is the key a hit carries: the turn, a colon, and the
# tool use id - or `-` when the hit is on the session rather than on a tool use, which is
# what a compaction and a model switch produce.
#
# `fire` is every detector that should fire there and is the whole truth about that event:
# a hit at a key with no `fire` entry naming the detector is a false positive, and a `fire`
# entry with no hit is a false negative. `near` names a detector this event is a deliberate
# near-miss for - a `cat` of a range, a `find` with a filter, a push after the gate ran, a
# heredoc with `rm -rf` in its body - and is what the negative count in `ruleprobe corpus`
# is counting. An event with neither is unremarkable and is expected to fire nothing.
#
# Every session under sessions/ is synthetic and hand-authored. No real transcript content,
# no home paths, no personal names, no live credentials.

version: 1

